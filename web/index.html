<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="AI 影视与短剧创作工作台" />
        <!-- 不写内置品牌资源：首屏必须品牌中性，favicon 由 use-appearance-store 解析出外观后写入。
             空 data URL 只是为了不让浏览器去请求 /favicon.ico（那会是一条 404）。 -->
        <link rel="icon" href="data:," />
        <title>正在加载</title>
        <style>
            /* Fix layer order before production chunks can register utilities ahead of base. */
            @layer theme, base, components, utilities;

            html,
            body {
                margin: 0;
                background: #ffffff;
            }
            /* 与 globals.css 的 .dark --background 一致；暗色主题下切页或首屏不透出白底。 */
            html.dark,
            html.dark body {
                background: #0f0f11;
            }
            #boot-recovery {
                position: fixed;
                inset-inline: 24px;
                top: calc(50% + 32px);
                text-align: center;
                font:
                    600 16px/1.3 system-ui,
                    sans-serif;
                color: #171717;
            }
            #boot-recovery p {
                margin: 0;
            }
            html.dark #boot-recovery {
                color: #f5f5f5;
            }
            #root:empty {
                min-height: 100vh;
            }
            #boot-recovery .loading-clover {
                position: fixed;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }
            /* 启动占位与 FullScreenLoader 共用，入口脚本加载前也能显示。 */
            .loading-clover {
                display: grid;
                width: 32px;
                height: 32px;
                grid-template: repeat(2, 1fr) / repeat(2, 1fr);
                gap: 2px;
            }
            .loading-clover > i {
                border-radius: 72% 72% 14% 72%;
                background: currentColor;
                animation: loading-clover-pulse 1200ms linear calc(var(--clover-offset, 0ms) - var(--loader-clock, 0ms)) infinite;
            }
            .loading-clover > i:nth-child(2) {
                --clover-offset: -900ms;
                transform: rotate(90deg);
            }
            .loading-clover > i:nth-child(3) {
                --clover-offset: -300ms;
                transform: rotate(-90deg);
            }
            .loading-clover > i:nth-child(4) {
                --clover-offset: -600ms;
                transform: rotate(180deg);
            }
            @keyframes loading-clover-pulse {
                0%,
                52%,
                100% {
                    opacity: 0.36;
                }
                22% {
                    opacity: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .loading-clover > i {
                    animation: none;
                }
            }
        </style>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("yingce:theme_store") || "{}");
                var t = s.state && s.state.theme === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <section id="boot-recovery" role="status" aria-live="polite">
            <span class="loading-clover" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <p>正在打开创作空间</p>
        </section>
        <script>
            // 入口或其依赖失败时 React 尚未挂载，路由错误页无法接管；提供不依赖外链资源的退出入口。
            var bootRoot = document.getElementById("root");
            var bootNotice = document.getElementById("boot-recovery");
            bootNotice.style.setProperty("--loader-clock", performance.now() + "ms");
            var bootTimer = setTimeout(function () {
                if (bootRoot.childNodes.length) return;
                var notice = document.createElement("section");
                notice.id = "boot-recovery";
                notice.setAttribute("role", "alert");
                notice.style.cssText = "position:fixed;inset:0;display:grid;align-content:center;justify-items:center;gap:16px;padding:24px;background:inherit;font:16px/1.6 sans-serif;text-align:center";
                var title = document.createElement("strong");
                title.textContent = "页面资源加载时间过长";
                var detail = document.createElement("p");
                detail.textContent = "部分启动资源未能加载，请重试。此操作不会清除浏览器中的画布缓存。";
                var retry = document.createElement("button");
                retry.type = "button";
                retry.textContent = "重新加载";
                retry.style.cssText = "padding:10px 24px;border:1px solid currentColor;border-radius:8px;background:transparent;color:inherit;font:inherit;cursor:pointer";
                retry.onclick = function () {
                    var url = new URL(location.href);
                    url.searchParams.set("__chunk_recovery", String(Date.now()));
                    location.replace(url.toString());
                };
                notice.append(title, detail, retry);
                bootNotice.replaceWith(notice);
            }, 20000);
            var bootObserver = new MutationObserver(function () {
                if (!bootRoot.childNodes.length) return;
                clearTimeout(bootTimer);
                bootObserver.disconnect();
                var notice = document.getElementById("boot-recovery");
                if (notice) notice.remove();
            });
            bootObserver.observe(bootRoot, { childList: true });
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
