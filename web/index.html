<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="AI 影视与短剧创作工作台" />
        <!-- 不写内置品牌资源：首屏必须品牌中性，favicon 由 use-appearance-store 解析出外观后写入。
             空 data URL 只是为了不让浏览器去请求 /favicon.ico（那会是一条 404）。 -->
        <link rel="icon" href="data:," />
        <title>正在加载</title>
        <style>
            /* Fix layer order before production chunks can register utilities ahead of base. */
            @layer theme, base, components, utilities;

            html,
            body {
                margin: 0;
                background: #ffffff;
            }
            /* 与 globals.css 的 .dark --background 一致；暗色主题下切页或首屏不透出白底。 */
            html.dark,
            html.dark body {
                background: #0f0f11;
            }
            #boot-recovery {
                position: fixed;
                inset-inline: 24px;
                top: calc(50% + 32px);
                text-align: center;
                font:
                    600 16px/1.3 system-ui,
                    sans-serif;
                color: #171717;
            }
            #boot-recovery p {
                margin: 0;
            }
            #boot-recovery button {
                margin-top: 12px;
                padding: 8px 16px;
                border: 1px solid currentColor;
                border-radius: 8px;
                background: transparent;
                color: inherit;
                font: inherit;
                cursor: pointer;
            }
            html.dark #boot-recovery {
                color: #f5f5f5;
            }
            #root:empty {
                min-height: 100vh;
            }
            #boot-recovery .loading-clover {
                position: fixed;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }
            /* 启动占位与 React 的 LoadingClover 共用，入口脚本加载前也能显示。 */
            .loading-clover {
                display: grid;
                width: 32px;
                height: 32px;
                grid-template: repeat(2, 1fr) / repeat(2, 1fr);
                gap: 2px;
            }
            .loading-clover > i {
                border-radius: 72% 72% 14% 72%;
                background: currentColor;
                animation: loading-clover-pulse 1200ms linear calc(var(--clover-offset, 0ms) - var(--loader-clock, 0ms)) infinite;
                animation-play-state: var(--loading-clover-play-state, running);
            }
            .loading-clover > i:nth-child(2) {
                --clover-offset: -900ms;
                transform: rotate(90deg);
            }
            .loading-clover > i:nth-child(3) {
                --clover-offset: -300ms;
                transform: rotate(-90deg);
            }
            .loading-clover > i:nth-child(4) {
                --clover-offset: -600ms;
                transform: rotate(180deg);
            }
            @keyframes loading-clover-pulse {
                0%,
                52%,
                100% {
                    opacity: 0.36;
                }
                22% {
                    opacity: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .loading-clover > i {
                    animation: none;
                }
            }
            .no-motion .loading-clover > i {
                animation: none;
            }
        </style>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("yingce:theme_store") || "{}");
                var t = s.state && s.state.theme === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <section id="boot-recovery" role="status" aria-live="polite">
            <span class="loading-clover" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <p>正在打开创作空间</p>
            <button type="button" hidden>重新加载</button>
        </section>
        <script>
            // 放在 #root 之后：外链样式加载完、首帧绘制前才执行，启动信号从这一刻对齐 performance.now()。
            (() => {
                const bootRoot = document.getElementById("root");
                bootRoot.style.setProperty("--boot-signal-clock", performance.now() + "ms");
                const notice = document.getElementById("boot-recovery");
                notice.style.setProperty("--loader-clock", performance.now() + "ms");
                const message = notice.querySelector("p");
                const retry = notice.querySelector("button");
                const entrySelector = 'script[type="module"][src]';
                let failed = false;
                let slow = false;
                let checkedVersion = false;

                function reload() {
                    const url = new URL(location.href);
                    url.searchParams.set("__chunk_recovery", String(Date.now()));
                    location.replace(url.toString());
                }

                function updateMessage() {
                    const offline = navigator.onLine === false;
                    message.textContent = offline ? "网络连接中断，请检查连接。" : failed ? "启动资源加载失败，请重试。" : slow ? "加载较慢，仍在继续…" : "正在打开创作空间";
                    retry.hidden = !offline && !failed;
                }

                async function showFailure(status) {
                    if (bootRoot.childNodes.length) return;
                    failed = true;
                    updateMessage();
                    if (checkedVersion || (status !== 404 && status !== 410) || new URL(location.href).searchParams.has("__chunk_recovery")) return;
                    checkedVersion = true;
                    try {
                        const current = document.querySelector(entrySelector);
                        if (!current) return;
                        const response = await fetch(location.href, { cache: "no-store", signal: AbortSignal.timeout(5000) });
                        if (!response.ok) return;
                        const latest = new DOMParser().parseFromString(await response.text(), "text/html").querySelector(entrySelector);
                        if (!latest) return;
                        const entry = new URL(latest.getAttribute("src"), response.url || location.href);
                        if (!bootRoot.childNodes.length && entry.origin === new URL(location.href).origin && /^\/assets\/[^/]+\.js$/.test(entry.pathname) && entry.href !== current.src) reload();
                    } catch {
                        // 版本检查失败时保留手动恢复入口。
                    }
                }

                function onStartupFailure(event) {
                    void showFailure(event.detail.status);
                }

                async function onScriptFailure(event) {
                    const entry = document.querySelector(entrySelector);
                    if (!entry || event.target !== entry || bootRoot.childNodes.length) return;
                    let status;
                    try {
                        const response = await fetch(entry.src, { method: "HEAD", cache: "no-store", signal: AbortSignal.timeout(5000) });
                        status = response.status;
                    } catch {
                        // 原生模块报错可能来自下游依赖，只有确认缺失才检查版本。
                    }
                    await showFailure(status);
                }

                retry.onclick = reload;
                addEventListener("online", updateMessage);
                addEventListener("offline", updateMessage);
                addEventListener("starai:startup-load-failure", onStartupFailure);
                addEventListener("error", onScriptFailure, true);
                updateMessage();
                const bootTimer = setTimeout(() => {
                    slow = true;
                    updateMessage();
                }, 20000);
                const bootObserver = new MutationObserver(() => {
                    if (!bootRoot.childNodes.length) return;
                    clearTimeout(bootTimer);
                    bootObserver.disconnect();
                    removeEventListener("online", updateMessage);
                    removeEventListener("offline", updateMessage);
                    removeEventListener("starai:startup-load-failure", onStartupFailure);
                    removeEventListener("error", onScriptFailure, true);
                    notice.remove();
                });
                bootObserver.observe(bootRoot, { childList: true });
            })();
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
